    const position = zone.dataset.dropPosition;
    const group = zone.dataset.dropGroup || "";
    let index = Number(zone.dataset.dropIndex || 0);
    const card = event.target.closest("[data-entry-id]");
    if (card && zone.contains(card)) {
      const context = cardContext(entryById(card.dataset.entryId));
      index = context.index + (event.clientY > card.getBoundingClientRect().top + card.getBoundingClientRect().height / 2 ? 1 : 0);
    }
    const dragged = entryById(state.ui.dragId);
    if (dragged) {
      const origin = cardContext(dragged);
      if (origin.position === position && origin.group === group && origin.index >= 0 && origin.index < index) index--;
    }
    return { zone, position, group, index };
  }
  document.addEventListener("dragover", event => {
    if (state.ui.dragId === null) return;
    event.preventDefault();
    dragPoint = { x: event.clientX, y: event.clientY };
    if (dragScrollFrame === null) dragScrollFrame = requestAnimationFrame(scrollDuringDrag);
    const target = dropTarget(event);
    event.dataTransfer.dropEffect = target ? "move" : "none";
    updateDragTarget();
  });
  document.addEventListener("drop", event => {
    if (state.ui.dragId === null) return;
    const target = dropTarget(event);
    const id = state.ui.dragId;
    finishDrag();
    if (!target) return;
    event.preventDefault();
    try { moveEntry(id, target.position, target.index, target.group); } catch (error) { reportError(error); }
  });
  document.addEventListener("dragend", finishDrag);
  document.addEventListener("dragleave", event => { if (event.relatedTarget === null) stopDragScroll(); });
  window.addEventListener("blur", finishDrag);
  window.addEventListener("pagehide", finishDrag);
  document.addEventListener("visibilitychange", () => { if (document.hidden) finishDrag(); });
  document.addEventListener("toggle", event => {
    if (!event.target.isConnected) return;
    if (event.target.id === state.ui.toolPanel && !event.target.open) {
      if (event.target.id === "plugins-panel") state.ui.pluginsOpen = false;
      else state.ui.panelsOpen[event.target.id] = false;
      closeToolPanel(); return;
    }
    if (event.target.id === "beginner-guide") state.ui.guideOpen = event.target.open;
    else if (event.target.id === "plugins-panel") state.ui.pluginsOpen = event.target.open;
    else if (event.target.id === "output-diff") state.ui.diffOpen = event.target.open;
    else if (own(state.ui.panelsOpen, event.target.id)) state.ui.panelsOpen[event.target.id] = event.target.open;
    else if (event.target.dataset.groupDisclosure) {
      const key = event.target.dataset.groupDisclosure;
      if (event.target.open) state.ui.collapsedGroups.delete(key); else state.ui.collapsedGroups.add(key);
    }
  }, true);
  window.addEventListener("resize", updateToolGeometry);
  core = QuartzEditor;
  let theme = "system";
  let locale = (navigator.language || "en").toLowerCase().startsWith("zh") ? "zh-CN" : "en";
  try { const stored = localStorage.getItem("quartz-editor-theme"); if (["system", "light", "dark"].includes(stored)) theme = stored; } catch {}
  try { const stored = localStorage.getItem("quartz-editor-locale"); if (["zh-CN", "en"].includes(stored)) locale = stored; } catch {}
  try { const stored = localStorage.getItem("quartz-editor-dock"); if (["top", "bottom"].includes(stored)) state.ui.dockPosition = stored; } catch {}
  state.ui.locale = locale;
  applyTheme(theme);
  loadConfig(defaultText(), { kind: "default", name: "" });
})();
</script>
</body>
</html>
